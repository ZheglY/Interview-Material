# Версия конфигурационного формата генерации Buf.
version: v2

# Генераторы закреплены по версиям, поэтому ноутбук и CI создают одинаковый код.
plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
    out: gen/go
    opt:
      - paths=source_relative
  - local:
      - go
      - run
      - google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
    out: gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true