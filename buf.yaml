# Версия конфигурационного формата Buf.
version: v2

# Единственный protobuf-модуль проекта находится в api/proto.
modules:
  - path: api/proto

# STANDARD проверяет имена пакетов, версионирование и совместимость API-стиля.
lint:
  use:
    - STANDARD

# FILE не позволяет случайно внести ломающие изменения в опубликованный контракт.
breaking:
  use:
    - FILE